name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: python -m pip install -e .[dev]

      - run: coverage run -m pytest
        env:
          STATS_NZ_API_KEY: ${{ secrets.STATS_NZ_API_KEY }}

      - run: coverage report -m