[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[project]
name = "flamingo-escooter"
version = "1.0.0"
description = "Tools for analyzing Flamingo E-Scooter movement patterns, trip data cleaning, and parking restriction compliance within the Auckland CBD."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Jeff He", email = "jhe482@aucklanduni.ac.nz" },
    { name = "Georgia Short", email = "gsho521@aucklanduni.ac.nz" },
    { name = "Hans Setiawan", email = "hset686@aucklanduni.ac.nz" },
]
keywords = [
    "escooter",
    "auckland",
    "urban-mobility",
    "transport",
    "giscience",
    "spatial-analysis",
    "new-zealand",
    "flamingo-scooters",
    "city-centre",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "pandas>=2.3.3",
    "geopandas>=1.1.3",
    "polyline>=2.0.4",
    "python-dotenv>=1.2.2",
    "folium>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "coverage>=7.0.0",
    "pycodestyle>=2.14.0",
    "ruff>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "coverage>=7.0.0",
    "pycodestyle>=2.14.0",
    "ruff>=0.15.0",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://github.com/jhe482-uoa/flamingo-escooter"
Documentation = "https://jhe482-uoa.github.io/flamingo-escooter/"
"API Documentation" = "https://jhe482-uoa.github.io/flamingo-escooter/api-reference.html"
"Source Code" = "https://github.com/jhe482-uoa/flamingo-escooter"
Changelog = "https://github.com/jhe482-uoa/flamingo-escooter/blob/main/CHANGELOG.md"

[tool.coverage.run]
source = ["flamingo_escooter"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.hatch.build.targets.sdist]
include = [
    "src/flamingo_escooter/**",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["flamingo_escooter"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
